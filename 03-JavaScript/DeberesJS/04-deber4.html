<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar color de fondo</title>
</head>
<body>
    <input type="color" id="colorInput" value="#ffffff">
    <button onclick="cambiarColor()">Cambiar color de fondo</button>

    <script>
        function cambiarColor() {
           
            let colorElegido = document.getElementById('colorInput').value;
           
            document.body.style.backgroundColor = colorElegido;
        }
    </script>
</body>
</html>
