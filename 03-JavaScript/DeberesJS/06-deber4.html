<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Números Aleatorios</title>
    <style>
        #num {
            width: 20%;
            height: 200px;
            border: 3px solid blue;
            text-align: center;
            padding: 5px;
            font-size: 100px;
            margin-left: 40%;
            margin-top: 10%;
        }
    </style>
</head>
<body>
    <div id="num" onclick="ryomNumber()">0</div>

    <script>
        function ryomNumber() {
            let numeroAleatorio = Math.floor(Math.random() * 101);
            document.getElementById('num').innerText = numeroAleatorio;
        }
    </script>
</body>
</html>
